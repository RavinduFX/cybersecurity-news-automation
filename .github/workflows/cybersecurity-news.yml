
name: Daily Cybersecurity News

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  cybersecurity-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm automation is running
        run: |
          echo "Cybersecurity news automation is running!"
          echo "Scheduled time: 9:00 AM Sri Lanka time."
