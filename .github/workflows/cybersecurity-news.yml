name: Daily Cybersecurity News

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  cybersecurity-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Install Bandit security scanner
        run: python -m pip install bandit

      - name: Run Python security scan
        id: bandit
        continue-on-error: true
        run: python -m bandit -r news_bot.py -ll

      - name: Fetch news and post to Slack
        if: ${{ !cancelled() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python news_bot.py

      - name: Summarize security check results
        if: ${{ always() }}
        run: |
          echo "Unit tests outcome: ${{ steps.tests.outcome }}"
          echo "Bandit scan outcome: ${{ steps.bandit.outcome }}"

      - name: Mark workflow as failed if checks failed
        if: ${{ !cancelled() && (steps.tests.outcome == 'failure' || steps.bandit.outcome == 'failure') }}
        run: |
          echo "One or more quality checks failed. Review the earlier logs."
          exit 1
